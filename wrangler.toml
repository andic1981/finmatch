name = "finmatch"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[vars]
ENVIRONMENT = "production"
AI_PROVIDER = "anthropic"
AI_MODEL = "claude-sonnet-4-6"
ALERT_FROM = "FinMatch <onboarding@resend.dev>"
PUBLIC_URL = "https://finmatch.workers.dev"
# Secret (set separately): npx wrangler secret put RESEND_API_KEY
# Secret (set separately): npx wrangler secret put AI_API_KEY

# KV for crawl results & source status
[[kv_namespaces]]
binding = "FINMATCH_KV"
id = "8744b18f2c244f23a1fc7f2d842b0947"

# Daily crawl at 05:00 UTC
[triggers]
crons = ["0 5 * * *"]

# Set ADMIN_EMAILS via `wrangler secret put ADMIN_EMAILS --config wrangler.toml`.
[[d1_databases]]
binding = "FINMATCH_DB"
database_name = "financingmatch-sources"
# Existing FinancingMatch D1 database.
database_id = "a91f5fd6-ec03-4605-aa56-34533aefecd1"
migrations_dir = "migrations"
